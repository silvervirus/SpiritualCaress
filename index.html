<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Caress - E-Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="sepia">

    <!-- The Header Box -->
    <header class="box theme-box">
        <img src="WIcon.png" alt="Spiritual Caress" class="app-icon">
        <div class="toolbar">
            <input type="file" id="fileInput" accept=".epub" />
            <div class="theme-buttons">
                <button onclick="setTheme('day')">Day</button>
                <button onclick="setTheme('sepia')">Sepia</button>
                <button onclick="setTheme('night')">Night</button>
                <button id="speakBtn" style="background-color: #4CAF50; color: white;">Read Aloud</button>
                <button id="speakBtn">Start Reading</button>
<button id="pausePlayBtn">Pause</button>
</div>
            </div>
        </div>
    </header>

    <!-- The Reader Box -->
    <main class="box reader-container" id="reader">
        <p>Upload an EPUB to begin your journey.</p>
    </main>

    <!-- The Footer Box -->
    <footer class="box nav-buttons">
        <button id="prevBtn">Back</button>
        <select id="chapterSelect"></select>
        <button id="nextBtn">Next</button>
    </footer>

</body>
</html>
