<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Caress</title>
    <!-- Library needed to open EPUB files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="sepia">
    <div id="container">
        <h1>Spiritual Caress</h1>
        <p><em>El libro es el alma.</em></p>
        
        <!-- File input -->
        <input type="file" id="fileInput" accept=".epub" />
        
        <div id="controls">
            <button onclick="setTheme('day')">Día</button>
            <button onclick="setTheme('sepia')">Sepia</button>
            <button onclick="setTheme('night')">Noche</button>
        </div>
        
        <div id="reader">
            <p>Sube un archivo para comenzar.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
